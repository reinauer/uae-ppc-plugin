name: Build Windows QEMU-UAE PPC plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows-plugin:
    name: Build Windows ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 32-bit
            runner: windows-latest
            msystem: MINGW32
            package_prefix: mingw-w64-i686
            # MSYS2 no longer packages glib2, pip or distlib for MINGW32,
            # so the 32-bit job builds a static glib and installs pip and
            # distlib from PyPI.
            packages: >-
              gettext-runtime:p gettext-tools:p libffi:p libiconv:p
              pcre2:p zlib:p python-installer:p python-packaging:p
            glib_version: 2.90.1
            glib_sha256: 93c941aa17d5eb1d53fe838365f29a8b4e539c222a256d974ec8f30fc413e396
            host_cpu: i386
            artifact: qemu-uae-windows-32bit
            dll_name: qemu-uae.dll
            qemu_version: 9.2.4
            qemu_sha256: f3cc1c4eabfdb288218ac3e33763dbe9e276d8bc890b867a2335d58de2ddd39a
            extra_patch_dir: ""
            pdb: false
          - label: 64-bit
            runner: windows-latest
            msystem: CLANG64
            package_prefix: mingw-w64-clang-x86_64
            packages: glib2:p python-distlib:p python-pip:p
            glib_version: ""
            glib_sha256: ""
            host_cpu: x86_64
            artifact: qemu-uae-windows-64bit
            dll_name: qemu-uae_x64.dll
            qemu_version: 11.1.3
            qemu_sha256: 5a8289c7940dc77d3873c81a6c29ba3afe1446fc9d36e77fa1658cdbecb84b22
            extra_patch_dir: ""
            pdb: false
          - label: ARM64
            runner: windows-11-arm
            msystem: CLANGARM64
            package_prefix: mingw-w64-clang-aarch64
            packages: glib2:p python-distlib:p python-pip:p
            glib_version: ""
            glib_sha256: ""
            host_cpu: aarch64
            artifact: qemu-uae-windows-arm64
            dll_name: qemu-uae_arm64.dll
            qemu_version: 11.1.3
            qemu_sha256: 5a8289c7940dc77d3873c81a6c29ba3afe1446fc9d36e77fa1658cdbecb84b22
            extra_patch_dir: ""
            pdb: false

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout QEMU-UAE PPC plugin builder
        uses: actions/checkout@v4

      - name: Install MSYS2 build dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          pacboy: ${{ matrix.packages }}
          install: >-
            base-devel
            curl
            diffutils
            file
            git
            patch
            tar
            xz
            ${{ matrix.package_prefix }}-meson
            ${{ matrix.package_prefix }}-ninja
            ${{ matrix.package_prefix }}-pkgconf
            ${{ matrix.package_prefix }}-python
            ${{ matrix.package_prefix }}-toolchain

      - name: Install pip, distlib and pycotap from PyPI
        if: matrix.glib_version != ''
        run: |
          set -euo pipefail
          mkdir -p wheels
          cd wheels
          curl -L --fail -O https://files.pythonhosted.org/packages/07/25/ee8c38ae72d66b844ce8eb9711ba905dba21ca1a8a0c960057c41cd23337/pip-26.3-py3-none-any.whl
          curl -L --fail -O https://files.pythonhosted.org/packages/c1/2b/238f02a4927fa2e27aa995371d240a468b52e42eae44a678434aff736b38/distlib-0.4.4-py2.py3-none-any.whl
          curl -L --fail -O https://files.pythonhosted.org/packages/36/f4/77b5a41d53ae3c530b204ed9a35137171b20f8ee0f337e2ec4993d6026a5/pycotap-1.3.1-py3-none-any.whl
          sha256sum -c <<'EOF'
          f3b60b20ffaadd4415ed7957212a38ac63fa4c5fa375bd0f4a797777940fad13  pip-26.3-py3-none-any.whl
          cf09d55b1e85a89576b036aeb71550bfd68320f3f21761ca329eadadad918638  distlib-0.4.4-py2.py3-none-any.whl
          1c3a25b3ff89e48f4e00f1f71dbbc1642b4f65c65d416524d07e73492fff25ea  pycotap-1.3.1-py3-none-any.whl
          EOF
          # MSYS2's Python is externally managed (PEP 668), so pip won't
          # install into it; python-installer does.
          python -m installer pip-26.3-py3-none-any.whl
          python -m installer distlib-0.4.4-py2.py3-none-any.whl
          python -m installer pycotap-1.3.1-py3-none-any.whl
          python -m pip --version

      - name: Build static glib
        if: matrix.glib_version != ''
        run: |
          set -euo pipefail
          version="${{ matrix.glib_version }}"
          tarball="glib-${version}.tar.xz"
          curl -L --fail -o "${tarball}" \
            "https://download.gnome.org/sources/glib/${version%.*}/${tarball}"
          echo "${{ matrix.glib_sha256 }}  ${tarball}" | sha256sum -c
          # MSYS2's tar copies symlink targets, which fails for links that
          # come before their target; the build needs neither license link.
          tar -xf "${tarball}" \
            --exclude="glib-${version}/COPYING" \
            --exclude="glib-${version}/gmodule/COPYING"
          # The options of MSYS2's static glib2 build, without tests and
          # documentation.  meson is a Windows program and needs the
          # Windows path of the MSYS2 prefix.
          meson setup glib-build "glib-${version}" \
            --prefix="$(cygpath -m "${MINGW_PREFIX}")" \
            --buildtype=release \
            --wrap-mode=nodownload \
            --auto-features=enabled \
            --default-library=static \
            -Dlibelf=disabled \
            -Dintrospection=disabled \
            -Ddtrace=disabled \
            -Dsystemtap=disabled \
            -Dsysprof=disabled \
            -Dglib_debug=disabled \
            -Dman-pages=disabled \
            -Ddocumentation=false \
            -Dtests=false
          meson compile -C glib-build
          meson install -C glib-build
          pkg-config --modversion glib-2.0
          pkg-config --static --libs glib-2.0

      - name: Build QEMU-UAE PPC plugin
        run: |
          set -euo pipefail

          workspace="$(cygpath -u "${GITHUB_WORKSPACE}")"
          artifact_dir="${workspace}/artifacts/${{ matrix.artifact }}"
          plugin_name="${{ matrix.dll_name }}"
          plugin_path="${artifact_dir}/${plugin_name}"
          plugin_base="${plugin_name%.dll}"
          mkdir -p "${artifact_dir}"

          export QEMU_UAE_WORK_DIR="${workspace}/build/${{ matrix.msystem }}"
          export QEMU_UAE_NINJA="$(command -v ninja)"
          export QEMU_UAE_QEMU_VERSION="${{ matrix.qemu_version }}"
          export QEMU_UAE_QEMU_SHA256="${{ matrix.qemu_sha256 }}"
          if [[ "${{ matrix.pdb }}" == "true" ]]; then
            export QEMU_UAE_PDB=1
            export QEMU_UAE_OUTPUT_PDB="${artifact_dir}/${plugin_base}.pdb"
          fi
          if [[ -n "${{ matrix.extra_patch_dir }}" ]]; then
            export QEMU_UAE_EXTRA_PATCH_DIR="${workspace}/${{ matrix.extra_patch_dir }}"
          fi

          if [[ "${QEMU_UAE_QEMU_VERSION}" == "9.2.4" ]] &&
             ! python -c 'import pycotap' 2>/dev/null; then
            python -m pip install \
              --disable-pip-version-check \
              pycotap==1.3.1
          fi

          ./build-qemu-uae-plugin.sh \
            --clean \
            --output "${plugin_path}" \
            --jobs "$(nproc)" \
            -- \
            --cpu="${{ matrix.host_cpu }}"

          if [[ -z "${QEMU_UAE_PDB:-}" ]]; then
            strip "${plugin_path}"
          fi
          file "${plugin_path}"
          if [[ -n "${QEMU_UAE_PDB:-}" ]]; then
            file "${artifact_dir}/${plugin_base}.pdb"
          fi

          ldd_output="${QEMU_UAE_WORK_DIR}/qemu-uae.ldd.txt"
          ldd "${plugin_path}" | tee "${ldd_output}"
          imports_output="${QEMU_UAE_WORK_DIR}/qemu-uae.imports.txt"
          objdump -p "${plugin_path}" |
            awk -F': ' '/DLL Name:/ { print $2 }' |
            tee "${imports_output}"
          msys2_deps="$(
            awk '/=>/ { print $3 } /^[[:space:]]*\// { print $1 }' \
              "${ldd_output}" |
            grep -E '^/(mingw|ucrt|clang|msys)[^/]*/.*[.]dll$' || true
          )"
          if [[ -n "${msys2_deps}" ]]; then
            echo "${plugin_name} still depends on MSYS2 DLLs:" >&2
            echo "${msys2_deps}" >&2
            exit 1
          fi
          imported_msys2_deps="$(
            grep -Ei \
              '^(zlib1|lib(glib|gmodule|gobject|gthread|gio|intl|iconv|pcre2|winpthread|gcc|stdc[+][+]))[-_.0-9A-Za-z]*[.]dll$' \
              "${imports_output}" || true
          )"
          if [[ -n "${imported_msys2_deps}" ]]; then
            echo "${plugin_name} imports MSYS2 runtime DLLs:" >&2
            echo "${imported_msys2_deps}" >&2
            exit 1
          fi

          ls -la "${artifact_dir}"

      - name: Upload QEMU-UAE PPC plugin
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}
          if-no-files-found: error
